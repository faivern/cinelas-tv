# nginx config for the cinelas-tv stack: proxies /api to the local `backend`
# service and /jellyfin/ to the media server, both over plain HTTP on the compose
# network. Baked into the frontend image and also mounted over
# /etc/nginx/conf.d/nginx.conf by docker-compose.cinelas-tv.yml, so edits apply
# on container restart without an image rebuild.
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    large_client_header_buffers 4 16k;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached: without this, WebView/browser heuristic
    # caching keeps serving a stale index that references old hashed bundles,
    # so deploys don't show up until the cache is cleared.
    location = /index.html {
        add_header Cache-Control "no-cache";
        # add_header in a location drops server-level headers; restore them.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA fallback — serve index.html for all client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API → local backend (HTTP, on the compose network)
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Jellyfin streams → jellyfin container. Prefix is stripped (proxy_pass with
    # trailing slash); the backend builds /jellyfin/... URLs and Jellyfin's HLS
    # playlists use relative segment URLs, so no base-URL config is needed.
    # Video bytes flow nginx→client directly — never through the ASP.NET backend.
    location /jellyfin/ {
        proxy_pass http://jellyfin:8096/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        # Websocket upgrade (Jellyfin uses it for session messages)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        # Streaming: don't buffer video to disk, allow long-lived connections.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        client_max_body_size 0;
    }

    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
